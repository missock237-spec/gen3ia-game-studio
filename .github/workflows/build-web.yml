# GEN3IA — Build Web : export HTML autonome jouable (réel, testé localement).
# Smoke test : structure HTML valide, scène embarquée, taille cohérente.
name: Build Web
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version sémantique', required: true, default: '1.0.0' }
      buildProfile: { description: 'Profil (debug|release)', required: false, default: 'release' }
      projectId: { description: 'ID projet GEN3IA', required: false, default: '' }
      artifactName: { description: 'Nom de l artifact', required: false, default: 'gen3ia-web' }
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Export HTML autonome
        run: |
          npm install --no-audit --no-fund esbuild three cannon-es --no-save
          node scripts/packaging/export-web.mjs "${{ inputs.version }}" "${{ inputs.projectId }}"

      - name: Smoke test export
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const html = fs.readFileSync('dist/game.html', 'utf8');
          const checks = [
            ['DOCTYPE', html.startsWith('<!DOCTYPE html>')],
            ['runtime embarqué', html.includes('__GEN3IA_EXPORT__')],
            ['scène embarquée', html.includes('"entities"')],
            ['taille > 100 KB', html.length > 100 * 1024],
            ['canvas présent', html.includes('<canvas')],
          ];
          let fail = 0;
          for (const [name, ok] of checks) { console.log((ok ? 'OK  ' : 'FAIL') + ' ' + name); if (!ok) fail++; }
          process.exit(fail ? 1 : 0);
          EOF

      - name: Checksum
        run: |
          sha256sum dist/game.html > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
