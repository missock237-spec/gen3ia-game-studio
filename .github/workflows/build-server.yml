# GEN3IA — Build Dedicated Server : bundle Node réel (socket.io) prêt à déployer,
# avec smoke test de démarrage (npm install → node server.js → stats HTTP).
name: Build Dedicated Server
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version sémantique', required: true, default: '1.0.0' }
      buildProfile: { description: 'Profil (debug|release)', required: false, default: 'release' }
      artifactName: { description: 'Nom de l artifact', required: false, default: 'gen3ia-server' }
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Bundle serveur
        run: |
          npm install --no-audit --no-fund esbuild socket.io --no-save
          node scripts/packaging/export-server.mjs "${{ inputs.version }}"

      - name: Smoke test — démarrage réel du serveur
        run: |
          cd dist
          npm install --omit=dev --no-audit --no-fund
          node server.js &
          SERVER_PID=$!
          sleep 4
          STATS=$(curl -sf http://localhost:3103/stats)
          echo "stats: $STATS"
          echo "$STATS" | grep -q '"tickRate"' || { echo "FAIL: stats invalides"; kill $SERVER_PID; exit 1; }
          kill $SERVER_PID

      - name: Checksum
        run: |
          cd dist && zip -qr ../gen3ia-server-${{ inputs.version }}.zip . && cd ..
          sha256sum "gen3ia-server-${{ inputs.version }}.zip" > "gen3ia-server-${{ inputs.version }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}-${{ inputs.version }}
          path: |
            dist/
            gen3ia-server-*.zip
            gen3ia-server-*.zip.sha256
          if-no-files-found: error
