# GEN3IA — Build Dedicated Server : bundle Node réel (socket.io) prêt à déployer.
name: Build Dedicated Server
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version sémantique', required: true, default: '1.0.0' }
      buildProfile: { description: 'Profil (debug|release)', required: false, default: 'release' }
      artifactName: { description: 'Nom de l artifact', required: false, default: 'gen3ia-server' }
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Bundle serveur
        run: |
          npm install --no-audit --no-fund esbuild socket.io --no-save
          node scripts/packaging/export-server.mjs "${{ inputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
