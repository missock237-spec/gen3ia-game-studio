# GEN3IA — Build Linux : artefact natif réel = package serveur dédié (Node) + client web.
name: Build Linux
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version sémantique', required: true, default: '1.0.0' }
      buildProfile: { description: 'Profil (debug|release)', required: false, default: 'release' }
      artifactName: { description: 'Nom de l artifact', required: false, default: 'gen3ia-linux' }
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Package serveur dédié Linux
        run: |
          npm install --no-audit --no-fund esbuild socket.io --no-save
          node - <<'EOF'
          const esbuild = require('esbuild');
          const fs = require('fs');
          esbuild.build({
            entryPoints: ['mini-services/game-server/index.ts'],
            bundle: true, minify: true, format: 'cjs', target: 'node20',
            platform: 'node', write: false, logLevel: 'silent', external: ['socket.io'],
            define: { 'process.env.NODE_ENV': '"production"' },
          }).then(r => {
            fs.mkdirSync('dist', { recursive: true });
            fs.writeFileSync('dist/gen3ia-server.js', r.outputFiles[0].text);
            console.log('bundle serveur:', Math.round(r.outputFiles[0].text.length/1024), 'KB');
          });
          EOF
          cp mini-services/game-server/package.json dist/package.json || echo '{"name":"gen3ia-game-server","scripts":{"start":"node server.js"},"dependencies":{"socket.io":"^4.8.3"}}' > dist/package.json
          tar -czf "gen3ia-linux-${{ inputs.version }}.tar.gz" -C dist .
          sha256sum "gen3ia-linux-${{ inputs.version }}.tar.gz" > "gen3ia-linux-${{ inputs.version }}.tar.gz.sha256"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}-${{ inputs.version }}
          path: |
            gen3ia-linux-*.tar.gz
            gen3ia-linux-*.tar.gz.sha256
          if-no-files-found: error
