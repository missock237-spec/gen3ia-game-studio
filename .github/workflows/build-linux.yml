# GEN3IA — Build Linux : package serveur dédié réel (bundle Node + world.json +
# start.sh + Dockerfile + README), smoke test de démarrage + checksum.
name: Build Linux
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version sémantique', required: true, default: '1.0.0' }
      buildProfile: { description: 'Profil (debug|release)', required: false, default: 'release' }
      artifactName: { description: 'Nom de l artifact', required: false, default: 'gen3ia-linux' }
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Package serveur dédié
        run: |
          npm install --no-audit --no-fund esbuild socket.io --no-save
          node scripts/packaging/export-server.mjs "${{ inputs.version }}"

      - name: Smoke test — démarrage réel du serveur
        run: |
          cd dist
          npm install --omit=dev --no-audit --no-fund
          node server.js &
          SERVER_PID=$!
          sleep 4
          STATS=$(curl -sf http://localhost:3103/stats)
          echo "stats: $STATS"
          echo "$STATS" | grep -q '"tickRate"' || { echo "FAIL: stats invalides"; kill $SERVER_PID; exit 1; }
          kill $SERVER_PID

      - name: Archive + checksum
        run: |
          chmod +x dist/start.sh
          tar -czf "gen3ia-linux-${{ inputs.version }}.tar.gz" -C dist .
          sha256sum "gen3ia-linux-${{ inputs.version }}.tar.gz" > "gen3ia-linux-${{ inputs.version }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}-${{ inputs.version }}
          path: |
            gen3ia-linux-*.tar.gz
            gen3ia-linux-*.tar.gz.sha256
          if-no-files-found: error
