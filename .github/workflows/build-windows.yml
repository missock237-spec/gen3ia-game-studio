# GEN3IA — Build Windows : exécutable réel via Node SEA (Single Executable Application)
# sur runner windows-latest. Le serveur socket.io est BUNDLÉ dans l'exe (SEA ne
# peut pas résoudre node_modules au runtime). Smoke test réel du démarrage.
name: Build Windows
on:
  workflow_dispatch:
    inputs:
      version: { description: 'Version sémantique', required: true, default: '1.0.0' }
      buildProfile: { description: 'Profil (debug|release)', required: false, default: 'release' }
      artifactName: { description: 'Nom de l artifact', required: false, default: 'gen3ia-windows' }
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Bundle serveur (socket.io inclus) + SEA blob
        shell: pwsh
        run: |
          npm install --no-audit --no-fund esbuild socket.io --no-save
          node scripts/packaging/export-sea-bundle.mjs
          node --experimental-sea-config sea-config.json
          node -e "require('fs').copyFileSync(process.execPath,'dist/gen3ia-server.exe')"
          Get-ChildItem dist

      - name: Retirer la signature du binaire puis injecter le blob SEA
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Select-Object -First 1).FullName
          if ($signtool) {
            Write-Host "signtool: $signtool"
            & $signtool remove /s dist\gen3ia-server.exe
          } else {
            Write-Host "signtool introuvable — postject gère l'injection directement"
          }
          npx postject dist\gen3ia-server.exe NODE_SEA_BLOB dist\sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Smoke test — démarrage réel de l'exécutable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\gen3ia-server.exe" -PassThru -NoNewWindow
          Start-Sleep -Seconds 6
          try {
            $r = Invoke-WebRequest -Uri "http://localhost:3103/stats" -UseBasicParsing -TimeoutSec 10
            if ($r.StatusCode -ne 200) { throw "stats HTTP $($r.StatusCode)" }
            Write-Host "SMOKE TEST OK — stats : $($r.Content.Substring(0, [Math]::Min(160, $r.Content.Length)))"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: README + checksum
        shell: pwsh
        run: |
          Set-Content -Path dist\README.txt -Value "GEN3IA serveur Windows v${{ inputs.version }}`n`nLancer: gen3ia-server.exe (socket.io :3003, stats/health :3103)`nLe monde (world.json) est chargé depuis le répertoire de l'exécutable si présent.`n"
          $h = (Get-FileHash dist\gen3ia-server.exe -Algorithm SHA256).Hash.ToLower()
          "$h  gen3ia-server.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Write-Host "sha256: $h"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifactName }}-${{ inputs.version }}
          path: |
            dist/gen3ia-server.exe
            dist/README.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
