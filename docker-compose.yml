version: "3.9"

# GEN3IA GAME STUDIO — stack production complète.
#   docker compose up -d        → PostgreSQL + Redis + serveur de jeu
#   npm install && npm run dev  → app Next.js (web + API)
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gen3ia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gen3ia_dev_password}
      POSTGRES_DB: gen3ia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gen3ia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serveur multijoueur autoritaire (socket.io, tick 20 Hz).
  game-server:
    build:
      context: .
      dockerfile: docker/game-server.Dockerfile
    environment:
      GAME_SERVER_PORT: 3003
      GAME_SERVER_STATS_PORT: 3103
      NODE_ENV: production
    ports:
      - "3003:3003"
      - "3103:3103"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
