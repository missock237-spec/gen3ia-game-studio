# GEN3IA GAME STUDIO — stack complète (PostgreSQL + Redis + game-server + app).
#   docker compose up -d --profile full   → tout, y compris l'app Next.js
#   docker compose up -d                  → infra + game-server (app lancée à part)
# Testé là où Docker est disponible : docker compose up --wait
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gen3ia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gen3ia_dev_password}
      POSTGRES_DB: gen3ia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gen3ia"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Serveur multijoueur autoritaire (socket.io, tick 20 Hz, SIGTERM propre).
  game-server:
    build:
      context: .
      dockerfile: docker/game-server.Dockerfile
    environment:
      GAME_SERVER_PORT: 3003
      GAME_SERVER_STATS_PORT: 3103
      NODE_ENV: production
      # persistence des positions (optionnel) :
      # GAME_SERVER_PERSIST_FILE: /data/positions.json
    ports:
      - "3003:3003"
      - "3103:3103"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3103/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 20s

  # App Next.js (web + API) — profil "full"
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://gen3ia:${POSTGRES_PASSWORD:-gen3ia_dev_password}@postgres:5432/gen3ia}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    stop_grace_period: 20s
    profiles: ["full"]

volumes:
  pgdata:
  redisdata:
