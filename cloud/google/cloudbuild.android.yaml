# GEN3IA — Pipeline Google Cloud Build : cible android (APK).
# Prérequis: bucket GCS_BUILD_BUCKET + service account (clé via GOOGLE_CLOUD_CREDENTIALS).
# Utilisée comme référence de pipeline distante ; le provider envoie aussi des steps inline.
steps:
  - name: 'node:20'
    entrypoint: 'bash'
    args: ['-lc', 'npm install --no-audit --no-fund && npx esbuild src/engine/export-runtime.ts --bundle --minify --format=iife --outfile=bundle.js']
  - name: 'ghcr.io/cirruslabs/android-sdk:34'
    entrypoint: 'bash'
    args: ['-lc', 'bash scripts/packaging/package-android.sh ${_VERSION} ${_PROFILE}']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args: ['-lc', 'gsutil cp dist/*.apk gs://${_GCS_BUCKET}/gen3ia-builds/${BUILD_ID}/']
substitutions:
  _VERSION: '1.0.0'
  _PROFILE: 'release'
  _GCS_BUCKET: 'gen3ia-builds'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: LEGACY
timeout: '3600s'
artifacts:
  objects:
    location: 'gs://${_GCS_BUCKET}/gen3ia-builds/${BUILD_ID}/'
    paths: ['dist/*.apk']
